[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "bogus_py"
description = "A Python package for data processing at the OGU, Bristol"
dynamic = ["version"]
dependencies = [
    "pandas>=2.0.0",
    "xlrd>=2.0.0",
    "rainbow-api>=1.3.0",
    "numpy>=1.23.2"
]
requires-python = ">=3.11"
authors = [
    {name = "Nick Hall", email = "nick.b.hall@bristol.ac.uk"}
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/ogubristol/bogus_py"
