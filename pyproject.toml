[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "bogus"
dynamic = ["version"]
dependencies = [
    "pandas>=2.0.0",
    "xlrd>=2.0.0"
]
requires-python = ">=3.11"
authors = [
    {name = "Nick Hall", email = "nick.b.hall@bristol.ac.uk"}
]
readme = "README.md"